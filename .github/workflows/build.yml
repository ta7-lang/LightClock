name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK + lint
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease lint --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=LightClock-v1.0-build${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          ls -l "$APK"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "Часы — сборка ${{ github.run_number }}" \
            --notes "Автоматическая сборка из коммита ${{ github.sha }}. Release APK подписан отладочным ключом."

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LightClock-apk
          path: LightClock-*.apk

      - name: Save build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || echo "no log" > /tmp/logs/build.log
          cp -r app/build/reports /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q -b build-logs
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-logs
